<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Solid dark fill — no transparent corners ever -->
  <rect width="100" height="100" fill="#090f1a"/>
  <!-- Subtle radial gradient like the logo background -->
  <radialGradient id="bg" cx="35%" cy="35%" r="75%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#1a2f4a"/>
    <stop offset="100%" stop-color="#090f1a"/>
  </radialGradient>
  <rect width="100" height="100" fill="url(#bg)"/>
  <!-- Cyan ring -->
  <circle cx="50" cy="50" r="30" stroke="#00d4f5" stroke-width="6.5" fill="none"/>
  <!-- Diagonal arrow shaft -->
  <line x1="33" y1="67" x2="63" y2="37" stroke="#00d4f5" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Arrowhead (top-right) -->
  <polyline points="50,35 65,35 65,50" stroke="#00d4f5" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
