<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#1a0a2e"/>
      <stop offset="100%" stop-color="#080010"/>
    </radialGradient>
    <linearGradient id="bolt" x1="40%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#d580ff"/>
      <stop offset="45%" stop-color="#a020f0"/>
      <stop offset="100%" stop-color="#6600bb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- Glow halo behind bolt -->
  <ellipse cx="50" cy="50" rx="28" ry="36" fill="#9900ee" opacity="0.28" filter="url(#glow)"/>

  <!-- Lightning bolt crystal shape -->
  <polygon
    points="57,10 33,52 50,52 43,90 67,48 50,48 57,10"
    fill="url(#bolt)"
    filter="url(#glow)"
    stroke="#cc66ff"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Shine facet overlay -->
  <polygon
    points="57,10 42,42 50,48 57,10"
    fill="url(#shine)"
  />

  <!-- Sparkle star top-right -->
  <g transform="translate(68,16)" opacity="0.95">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0" stroke="white" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="white" stroke-width="0.7" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
