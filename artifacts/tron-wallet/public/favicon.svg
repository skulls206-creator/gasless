<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Pitch-black bleed fills every pixel — no transparency anywhere -->
  <rect width="100" height="100" fill="#090f1a"/>
  <!-- Rounded-square card matches the logo's visible shape -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="#0e1929"/>
  <!-- Subtle top-left highlight -->
  <radialGradient id="hl" cx="30%" cy="28%" r="60%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#1a3050" stop-opacity="1"/>
    <stop offset="100%" stop-color="#0e1929" stop-opacity="1"/>
  </radialGradient>
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#hl)"/>
  <!-- Cyan ring -->
  <circle cx="50" cy="50" r="30" stroke="#00d4f5" stroke-width="6.5" fill="none"/>
  <!-- Diagonal arrow shaft -->
  <line x1="33" y1="67" x2="63" y2="37" stroke="#00d4f5" stroke-width="6.5" stroke-linecap="round"/>
  <!-- Arrowhead (top-right) -->
  <polyline points="50,35 65,35 65,50" stroke="#00d4f5" stroke-width="6.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
