<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Gasless</title>
  <script>
    // GitHub Pages SPA fallback: redirect to index.html with the original
    // path encoded in the query string so index.html can restore it.
    var path = window.location.pathname.slice(1);
    var search = window.location.search;
    var hash = window.location.hash;
    if (path || search || hash) {
      window.location.replace('/?/' + path + (search || hash ? (search || hash) : ''));
    }
  </script>
</head>
<body>
  <p>Redirecting to Gasless…</p>
</body>
</html>
